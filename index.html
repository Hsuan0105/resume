<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>我的自我介紹</title>
    <style>
        body {
            font-family: "Segoe UI", sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #74ebd5, #ACB6E5);
            color: #333;
        }
        .container {
            max-width: 800px;
            margin: 50px auto;
            background: white;
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .profile {
            text-align: center;
        }
        .profile img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
        }
        h1 {
            margin: 10px 0;
        }
        .section {
            margin-top: 30px;
        }
        .section h2 {
            border-left: 5px solid #74ebd5;
            padding-left: 10px;
        }
        .skills span {
            display: inline-block;
            background: #74ebd5;
            color: white;
            padding: 5px 10px;
            border-radius: 10px;
            margin: 5px;
        }
        footer {
            text-align: center;
            margin-top: 30px;
            color: gray;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="profile">
        <img src="https://via.placeholder.com/120" alt="大頭貼">
        <h1>你的名字</h1>
        <p>一段簡短的自我介紹，例如：熱愛學習與創作的學生</p>
    </div>

    <div class="section">
        <h2>關於我</h2>
        <p>
            這裡寫你的背景介紹，例如學校、科系、興趣或人生目標。
        </p>
    </div>

    <div class="section">
        <h2>技能</h2>
        <div class="skills">
            <span>HTML</span>
            <span>CSS</span>
            <span>JavaScript</span>
            <span>設計</span>
        </div>
    </div>

    <div class="section">
        <h2>聯絡方式</h2>
        <p>Email：your@email.com</p>
        <p>Instagram：@your_account</p>
    </div>

    <footer>
        © 2026 你的名字
    </footer>
</div>

</body>
</html>
